name: Environment Exploration

on: [push]

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show environment
        run: |
          node --version
          npm --version
          pwd
          ls -la

      - name: Install dependencies
        run: npm install
